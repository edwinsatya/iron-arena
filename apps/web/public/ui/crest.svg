<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9ad"/>
      <stop offset="0.5" stop-color="#e2b458"/>
      <stop offset="1" stop-color="#9a6a24"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#8d93a6"/>
    </linearGradient>
    <linearGradient id="gules" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e45a4e"/>
      <stop offset="1" stop-color="#a5302a"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a93e8"/>
      <stop offset="1" stop-color="#2a55a6"/>
    </linearGradient>
    <clipPath id="shield">
      <path d="M13 11 H51 V31 C51 45 42 53 32 57 C22 53 13 45 13 31 Z"/>
    </clipPath>
  </defs>
  <!-- Crossed swords behind the shield -->
  <g stroke-linecap="round">
    <path d="M6 6 L58 58" stroke="#2a2433" stroke-width="7"/>
    <path d="M58 6 L6 58" stroke="#2a2433" stroke-width="7"/>
    <path d="M7 7 L57 57" stroke="url(#steel)" stroke-width="3.5"/>
    <path d="M57 7 L7 57" stroke="url(#steel)" stroke-width="3.5"/>
  </g>
  <g fill="url(#gold)" stroke="#2a1a0a" stroke-width="1.2">
    <rect x="49" y="53" width="11" height="4" rx="1.5" transform="rotate(-45 54.5 55)"/>
    <rect x="4" y="53" width="11" height="4" rx="1.5" transform="rotate(45 9.5 55)"/>
  </g>
  <!-- The shield, per pale gules and azure: the two challengers -->
  <path d="M13 11 H51 V31 C51 45 42 53 32 57 C22 53 13 45 13 31 Z" fill="#1c1925"/>
  <g clip-path="url(#shield)">
    <rect x="13" y="11" width="19" height="47" fill="url(#gules)"/>
    <rect x="32" y="11" width="19" height="47" fill="url(#azure)"/>
    <!-- A silver chevron across both -->
    <path d="M10 46 L32 26 L54 46 L54 54 L32 34 L10 54 Z" fill="url(#steel)" stroke="#2a2433" stroke-width="1.2"/>
    <path d="M13 11 H51 V15 H13 Z" fill="#000" opacity="0.18"/>
  </g>
  <path d="M13 11 H51 V31 C51 45 42 53 32 57 C22 53 13 45 13 31 Z" fill="none" stroke="#2a1a0a" stroke-width="4"/>
  <path d="M13 11 H51 V31 C51 45 42 53 32 57 C22 53 13 45 13 31 Z" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <!-- Gold boss at the top -->
  <circle cx="32" cy="18" r="3.2" fill="url(#gold)" stroke="#2a1a0a" stroke-width="1"/>
</svg>
